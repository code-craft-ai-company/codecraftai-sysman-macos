[tool.poetry]
name = "automojo-sysman-macos"
description = "Automation Mojo - System Management MacOS"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
automojo-this-app = { git = "https://github.com/automationmojo/automojo-this-app.git", branch = "main" }
automojo-arcli = { git = "https://github.com/automationmojo/automojo-arcli.git", branch = "main" }
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-credentials = { git = "https://github.com/automationmojo/automojo-credentials.git", branch = "main" }
automojo-dataprofiles = { git = "https://github.com/automationmojo/automojo-dataprofiles.git", branch = "main" }
automojo-interfaces = { git = "https://github.com/automationmojo/automojo-interfaces.git", branch = "main" }
automojo-testbase = { git = "https://github.com/automationmojo/automojo-testbase.git", branch = "main" }
automojo-interop = { git = "https://github.com/automationmojo/automojo-interop.git", branch = "main" }
# automojo-sysman-common: development override using a local path.  The
# eventual production form is:
#     automojo-sysman-common = { git = "https://github.com/automationmojo/automojo-sysman-common.git", branch = "main" }
automojo-sysman-common = { path = "../automojo-sysman-common", develop = true }
automojo-waiting = { git = "https://github.com/automationmojo/automojo-waiting.git", branch = "main" }

[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
